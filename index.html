<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Retrospectivas simples, en tiempo real, sin login. Compartí un link y listo." />
    <meta property="og:title" content="retritoboard" />
    <meta property="og:description" content="Retrospectivas simples, en tiempo real, sin login." />
    <meta property="og:type" content="website" />
    <title>retritoboard</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('retritoboard:theme');
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
